server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to M1 Express server
    location /api/ {
        proxy_pass http://m1-server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy uploaded document downloads
    location /uploads/ {
        proxy_pass http://m1-server:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all routes served by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Vite-fingerprinted static assets aggressively
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
